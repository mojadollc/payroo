<!DOCTYPE html>
<html><body style="font-family:sans-serif;padding:20px">
<h2>PayrooPOS Icon Generator</h2>
<p>Right-click each image → "Save Image As" → save to your project's public/ folder</p>
<h3>icon-512.png</h3>
<canvas id="c512" width="512" height="512"></canvas>
<h3>icon-192.png</h3>
<canvas id="c192" width="192" height="192"></canvas>
<script>
function draw(id, size) {
  const c = document.getElementById(id);
  const ctx = c.getContext('2d');
  const r = size * 0.156;
  ctx.beginPath();
  ctx.moveTo(r, 0); ctx.lineTo(size-r, 0);
  ctx.quadraticCurveTo(size, 0, size, r);
  ctx.lineTo(size, size-r);
  ctx.quadraticCurveTo(size, size, size-r, size);
  ctx.lineTo(r, size);
  ctx.quadraticCurveTo(0, size, 0, size-r);
  ctx.lineTo(0, r);
  ctx.quadraticCurveTo(0, 0, r, 0);
  ctx.fillStyle = '#EFBF04';
  ctx.fill();
  ctx.fillStyle = 'white';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = '900 ' + (size*0.25) + 'px "Arial Black", Arial, sans-serif';
  ctx.fillText('Payroo', size/2, size*0.4);
  ctx.font = '900 ' + (size*0.22) + 'px "Arial Black", Arial, sans-serif';
  ctx.fillStyle = '#fffbe6';
  ctx.fillText('POS', size/2, size*0.68);
}
draw('c512', 512);
draw('c192', 192);
</script>
</body></html>
